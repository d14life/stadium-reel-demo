<script>
(()=>{const b=document.getElementById('boot'),$=i=>document.getElementById(i),
T={en:['INTERGALACTIC STADIUM','name chosen by fans — soon','loading','Taking long… wait or retry.'],
ru:['МЕЖГАЛАКТИЧЕСКИЙ СТАДИОН','название выберут фанаты','загрузка','Долго… подождите или повторите.'],

let L='en';try{const q=new URLSearchParams(location.search).get('lang'),s=localStorage.getItem('lang'),nl=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language]).map(x=>String(x||'').slice(0,2).toLowerCase()).find(x=>T[x]);L=T[q]?q:T[s]?s:nl||'en'}catch(e){}   // same order as i18n.js: ?lang= -> stored -> browser languages -> en
const d=T[L],w=L=='zh'?[d[0]]:d[0].split(' ');let n=0;
$('bt').innerHTML=w.map(s=>'<b>'+[...s].map(c=>'<span style="--i:'+n+++'">'+c+'</span>').join('')+'</b>').join('');
$('bp').textContent=d[1];$('bl').textContent=d[2];
const fit=()=>{const t=$('bt'),k=Math.min(innerWidth-36,540)/Math.max(...[...t.children].map(e=>e.offsetWidth+16),1);t.style.fontSize=Math.max(22,Math.min(L=='zh'?64:60,parseFloat(getComputedStyle(t).fontSize)*k))+'px'};
$('bt').style.fontSize='40px';fit();addEventListener('resize',fit);
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,X=+b.dataset.x,br=$('br'),bs=$('bs'),bh=$('bh'),len=br.getTotalLength();
let tot=0,tg=.03,cu=0,done=0,ff=0;
try{new PerformanceObserver(l=>{for(const e of l.getEntries())tot+=e.encodedBodySize||e.transferSize||2e4;tg=Math.max(tg,Math.min(.96,.03+.93*tot/X))}).observe({type:'resource',buffered:true})}catch(e){}
const t0=performance.now(),set=p=>{b.style.setProperty('--p',p);$('bn').textContent=Math.round(p*100);br.style.strokeDashoffset=100-p*100;bs.style.strokeDasharray=p*100+' 100';const q=br.getPointAtLength(p*len);bh.setAttribute('cx',q.x);bh.setAttribute('cy',q.y)};

if(!done&&r&&r.info.render.frame>1){ff=ff||performance.now();const sc=window.__stadium.scene,E=sc&&sc.getObjectByName('earth');const cf=window.__stadium.crowdF;if(performance.now()-ff>15e3||(cf!=null&&r.info.render.frame>cf+1&&(!E||E.visible))){done=1;tg=1;window.__firstFrame=ff}}
cu=rm?tg:cu+(tg-cu)*(done?.25:.07);set(cu);
if(done&&cu>.995){set(1);setTimeout(()=>{b.classList.add('d');setTimeout(()=>b.remove(),950)},180);return}
if(!done&&performance.now()-t0>45e3){$('bm2').textContent=d[3]||T.en[3];b.classList.add('x')}

<script>
// Boot: pick a working CDN for three.js (jsdelivr, else unpkg), then install the import map and start the app modules in order.
(async () => {
  const CDN = ['https://cdn.jsdelivr.net/npm/three@0.160.0/', 'https://unpkg.com/three@0.160.0/'];
  let base = null;
  for (let tries = 0; tries < 4 && !base; tries++) {
    for (const c of CDN) { try { await import(c + 'build/three.module.js'); base = c; break; } catch (e) { /* next CDN */ } }
    if (!base) await new Promise(r => setTimeout(r, 1200 * (tries + 1)));
  }
  if (!base) { __boot.err('No connection. Check your internet and retry. / Нет сети. Проверьте интернет и повторите.'); return; }
  const m = document.createElement('script'); m.type = 'importmap';
  m.textContent = JSON.stringify({ imports: { three: base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } });
  document.head.append(m);
  for (const s of ['main', 'join', 'sound', 'tiermap', 'editor']) {
    const e = document.createElement('script'); e.type = 'module'; e.async = false; e.src = 'js/' + s + '.js?v=39z'; document.body.append(e);
  }
})();
</script>
