<style>

<script>
(()=>{if(/[?&]reel=1(&|$)/.test(location.search)){document.getElementById('boot').remove();return}   // footage never shows the loader: reel.js owns rAF + clock, so its frame loop would not run
const b=document.getElementById('boot'),$=i=>document.getElementById(i),
T={en:['loading','Taking long…','Retry'],ru:['загрузка','Долго…','Повторить'],es:['cargando','Tarda mucho…','Reintentar'],pt:['carregando','Está demorando…','Tentar de novo'],zh:['加载中','加载较慢…','重试']};
let L='en';try{const q=new URLSearchParams(location.search).get('lang'),s=localStorage.getItem('lang'),nl=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language]).map(x=>String(x||'').slice(0,2).toLowerCase()).find(x=>T[x]);L=T[q]?q:T[s]?s:nl||'en'}catch(e){}   // same order as i18n.js: ?lang= -> stored -> browser languages -> en
const d=T[L];$('bl').textContent=d[0];$('bm2').textContent=d[1];$('brt').textContent=d[2];
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,X=+b.dataset.x,TAU=Math.PI*2;
// ---- progress (same driver in A/B/C): tg = real bytes seen / data-x (as index.html), done = scene ready ----
let tot=0,tg=.03,cu=0,done=0,ff=0,hf=0,full=0,shown=-1;
const feed=n=>{tot+=n;tg=Math.max(tg,Math.min(.96,.03+.93*tot/X))};
try{new PerformanceObserver(l=>{for(const e of l.getEntries())feed(e.encodedBodySize||e.transferSize||2e4)}).observe({type:'resource',buffered:true})}catch(e){}
// shown %: time-based from a predicted total P (last good boot on this device, else phone 14 s / desktop 6 s), every frame, so it never sits still; real progress (tg) is a floor it catches up to smoothly; past P it still ticks +1 per ~1.2 s up to 99
let P=/Android|iPhone|iPad/.test(navigator.userAgent)||matchMedia('(pointer:coarse)').matches?14e3:6e3;try{const v=+localStorage.getItem('bootMs');if(v>0)P=Math.min(3e4,Math.max(3e3,v*1.1))}catch(e){}window.__bootP=P;const sv=ms=>{try{localStorage.setItem('bootMs',Math.round(ms))}catch(e){}};
const step=(t,dt)=>{if(done){cu+=(1-cu)*(1-Math.exp(-dt/110));if(cu>.996)cu=1;return}
  const u=t/P,tc=u<1?.85*u*(1.3-.3*u):.85+(t-P)/1200*.01,R=Math.min(.98,.03+.95*tg/.96);
  cu=Math.min(.99,Math.max(cu,tc));if(R>cu)cu+=(R-cu)*(1-Math.exp(-dt/300))};   // ponytail: tail reaches 99 at P+17 s, the 25 s hard fallback ends it anyway

// ---- stadium model (metres-ish): pitch 105 x 68, bowl rows are true offset curves of the pitch rectangle ----
const PL=52.5,PW=34,SP=6.2,GAP=3,M0=9,RAD=SP*.36,tin=t=>M0+t*(3*SP+GAP),DR=tin(3)-GAP+3.4,RW=4.6;
const pt=(o,s)=>{for(let k=0;k<8;k++){const q=k&3,nx=[1,0,-1,0][q],ny=[0,1,0,-1][q],h=q&1?PW:PL,l=q&1?PL:PW;if(s<2*l)return[nx*(h+o)+ny*(l-s),ny*(h+o)+nx*(s-l)];s-=2*l;const c=Math.PI*o/2;if(s<c){const f=q*Math.PI/2+s/o;return[nx*h-ny*l+o*Math.cos(f),ny*h+nx*l+o*Math.sin(f)]}s-=c}return[PL+o,0]};
let sd=7;const rnd=()=>{sd=(sd+0x6D2B79F5)|0;let t=Math.imul(sd^(sd>>>15),1|sd);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};   // mulberry32: same crowd every load
const PAL=['#FFD23F','#FF8A1F','#4FC3F7','#9B5DE5','#FF5FA2','#F4F5F7','#3DDC84','#FF3B30'],seats=[];
for(let t=0;t<3;t++)for(let j=0;j<3;j++){const o=tin(t)+SP*(j+.5),P=4*(PL+PW)+TAU*o,n=Math.round(P/SP);
  for(let i=0;i<n;i++){const[x,y]=pt(o,((i+.5+(j&1)*.5)*P/n)%P),blk=Math.floor((Math.atan2(y,x)+Math.PI)/TAU*14)+t*5;
    seats.push({x,y,c:rnd()<.42?(blk*3)%8:Math.floor(rnd()*8),k:rnd()*.72+.28*(.5+.5*Math.sin(x*.045+2*Math.sin(y*.05))),t0:0})}}
const N=seats.length,order=seats.slice().sort((p,q)=>p.k-q.k),POP=340;let nf=0;

// ---- layers: S = static (bg, bowl, pitch, empty seats, ring), G = ring glow (alpha follows progress) ----
const cv=$('bc'),cx=cv.getContext('2d'),S=document.createElement('canvas'),G=document.createElement('canvas');let K=1,M=[1,0,0,1,0,0];
const rr=(c,o)=>c.roundRect(-PL-o,-PW-o,2*(PL+o),2*(PW+o),Math.max(0,o));
const layout=()=>{const W=innerWidth,H=innerHeight,dp=Math.min(3,devicePixelRatio||1),por=H>W,ex=PL+DR+RW,ey=PW+DR+RW,
  sc=Math.min(3,por?Math.min((W-32)/(2*ey),H*.62/(2*ex)):Math.min(W*.8/(2*ex),(H-150)/(2*ey))),hh=(por?ex:ey)*sc,top=Math.max(16,(H-2*hh-96)/2-H*.02);
  for(const c of[cv,S,G]){c.width=Math.round(W*dp);c.height=Math.round(H*dp)}
  K=sc*dp;const cxp=W/2*dp,cyp=(top+hh)*dp;M=por?[0,-K,K,0,cxp,cyp]:[K,0,0,K,cxp,cyp];b.style.setProperty('--ty',top+2*hh+22+'px');
  const s=S.getContext('2d'),g=G.getContext('2d');
  let gr=s.createRadialGradient(cxp,cyp,0,cxp,cyp,Math.max(W,H)*dp*.7);gr.addColorStop(0,'#131c36');gr.addColorStop(.5,'#0b1020');gr.addColorStop(1,'#070a15');s.fillStyle=gr;s.fillRect(0,0,S.width,S.height);
  s.setTransform(...M);
  s.fillStyle='#090d1a';s.beginPath();rr(s,DR);s.fill();                                       // concourse under the ring
  s.fillStyle='#05070e';s.beginPath();rr(s,tin(3)-GAP+.8);s.fill();                            // tier dividers = the dark showing between bands
  for(let t=0;t<3;t++){s.beginPath();rr(s,tin(t)+3*SP);rr(s,tin(t));gr=s.createLinearGradient(0,-PW-tin(t+1),0,PW+tin(t+1));gr.addColorStop(0,'#18203a');gr.addColorStop(1,'#121931');s.fillStyle=gr;s.fill('evenodd')}
  s.fillStyle='#0d1428';s.beginPath();rr(s,M0-.6);s.fill();                                    // apron
  pitch(s,TAU);
  s.fillStyle='#242b3e';s.beginPath();for(const p of seats){s.moveTo(p.x+RAD,p.y);s.arc(p.x,p.y,RAD,0,TAU)}s.fill();   // empty seats
  s.lineWidth=RW;s.strokeStyle='#E10600';s.shadowColor='#E10600';s.shadowBlur=10*dp;s.beginPath();rr(s,DR);s.stroke();s.shadowBlur=0;   // the red ring: crisp core + inner highlight
  s.lineWidth=.8;s.strokeStyle='rgba(255,130,115,.75)';s.beginPath();rr(s,DR-RW*.18);s.stroke();
  g.setTransform(...M);g.lineWidth=RW*1.6;g.strokeStyle='rgba(225,6,0,.9)';g.shadowColor='#ff1a0d';g.shadowBlur=22*dp;g.beginPath();rr(g,DR);g.stroke();g.shadowBlur=40*dp;g.lineWidth=RW;g.stroke();
};
// pitch: 18 mower passes (seams on the goal lines + halfway, as grass.js), colours = the app's turf (grass.js base 0.017/0.128/0.020 linear, +-25 % stripe) in sRGB, floodlight sheen, white paint
const pitch=s=>{const RX=PL+5,RY=PW+4.5,pw=105/18;let gr;s.save();s.beginPath();s.rect(-RX,-RY,2*RX,2*RY);s.clip();
  for(let i=-1;i<19;i++){s.fillStyle=i&1?'#1f5d24':'#2a7128';s.fillRect(-PL+i*pw,-RY,pw+.05,2*RY)}
  for(const[qx,qy]of[[-1,-1],[1,-1],[-1,1],[1,1]]){gr=s.createRadialGradient(qx*RX,qy*RY,0,qx*RX,qy*RY,PL*1.3);gr.addColorStop(0,'rgba(255,250,225,.16)');gr.addColorStop(1,'rgba(255,250,225,0)');s.fillStyle=gr;s.fillRect(-RX,-RY,2*RX,2*RY)}
  gr=s.createRadialGradient(0,0,PW*.6,0,0,PL*1.25);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,10,0,.32)');s.fillStyle=gr;s.fillRect(-RX,-RY,2*RX,2*RY);s.restore();
  const am=(x,y,r,a0,da)=>{s.moveTo(x+r*Math.cos(a0),y+r*Math.sin(a0));s.arc(x,y,r,a0,a0+da)};s.strokeStyle='rgba(255,255,255,.92)';s.fillStyle='#fff';s.lineWidth=.75;s.lineJoin='round';s.beginPath();
  s.rect(-PL,-PW,2*PL,2*PW);s.moveTo(0,-PW);s.lineTo(0,PW);s.moveTo(9.15,0);s.arc(0,0,9.15,0,TAU);
  for(const q of[-1,1]){s.rect(q>0?PL-16.5:-PL,-20.16,16.5,40.32);s.rect(q>0?PL-5.5:-PL,-9.16,5.5,18.32);s.rect(q>0?PL:-PL-2,-3.66,2,7.32);const a=Math.acos(5.5/9.15);am(q*(PL-11),0,9.15,q>0?Math.PI-a:-a,2*a)}
  for(const[qx,qy]of[[-1,-1],[1,-1],[-1,1],[1,1]])am(qx*PL,qy*PW,1,Math.atan2(-qy,-qx)-Math.PI/4,Math.PI/2);
  s.stroke();s.beginPath();for(const x of[0,-PL+11,PL-11]){s.moveTo(x+.5,0);s.arc(x,0,.5,0,TAU)}s.fill()};
layout();addEventListener('resize',layout);

const ease=u=>1-Math.pow(1-u,3),draw=(now,p)=>{
  const n=p>=1?N:Math.min(N-1,Math.round(p*N));for(;nf<n;nf++)order[nf].t0=rm?now-POP:now;   // a few seats per frame: the smoothed progress sets the pace
  cx.setTransform(1,0,0,1,0,0);cx.drawImage(S,0,0);cx.globalAlpha=.3+.4*p;cx.drawImage(G,0,0);cx.globalAlpha=1;cx.setTransform(...M);
  for(let c=0;c<8;c++){cx.fillStyle=PAL[c];cx.beginPath();for(let i=0;i<nf;i++){const s=order[i];if(s.c==c&&now-s.t0>=POP){cx.moveTo(s.x+RAD,s.y);cx.arc(s.x,s.y,RAD,0,TAU)}}cx.fill()}
  cx.fillStyle='rgba(255,255,255,.38)';cx.beginPath();for(let i=0;i<nf;i++){const s=order[i];if(now-s.t0>=POP){cx.moveTo(s.x+RAD*.17,s.y+RAD*.3);cx.arc(s.x-RAD*.25,s.y+RAD*.3,RAD*.42,0,TAU)}}cx.fill();   // tiny sheen: a dot reads as a body, not a pixel
  for(let i=nf-1;i>=0&&now-order[i].t0<POP;i--){const s=order[i],u=Math.max(0,(now-s.t0)/POP);const r=RAD*(u<.55?1.35*ease(u/.55):1.35-.35*ease((u-.55)/.45));
    cx.fillStyle=PAL[s.c];cx.beginPath();cx.arc(s.x,s.y,Math.max(.01,r),0,TAU);cx.fill();cx.strokeStyle=PAL[s.c];cx.globalAlpha=.6*(1-u);cx.lineWidth=.45;cx.beginPath();cx.arc(s.x,s.y,RAD*(1+1.6*u),0,TAU);cx.stroke();cx.globalAlpha=1}
  const v=p>=1?100:Math.min(99,Math.floor(p*100));if(v!=shown){shown=v;$('bn').firstChild.nodeValue=v;$('bpb').setAttribute('aria-valuenow',v)}};

const t0=performance.now(),HOLD=rm?150:520;let last=t0;
const tick=now=>{if(!b.isConnected)return;const dt=Math.min(100,now-last);last=now;const r=window.__stadium&&window.__stadium.renderer;
if(!done&&r&&r.info.render.frame>1){ff=ff||performance.now();const sc=window.__stadium.scene,E=sc&&sc.getObjectByName('earth');const cf=window.__stadium.crowdF,F=r.info.render.frame;const H=window.__hq;if(H&&H.ready&&!hf)hf=F;const hok=!window.__gfx||(hf&&F>hf+2)||(!H&&window.__bootT&&window.__bootT.hqLayer!=null);const why=performance.now()-ff>15e3?'15 s after first frame':cf!=null&&F>cf+1&&(!E||E.visible)&&hok?'scene ready':'';if(why){done=1;tg=1;window.__firstFrame=ff;sv(now-t0);console.log('[boot] loader done ('+why+') t='+Math.round(now))}}if(!done&&now-t0>25e3&&r){done=1;tg=1;sv(now-t0);console.warn('[boot] loader done (hard fallback 25 s, frame '+r.info.render.frame+')')}
step(now-t0,dt);draw(now,cu);
if(cu==1&&!full)full=now;
if(full&&now-full>HOLD){b.classList.add('d');setTimeout(()=>b.remove(),950);return}
if(!done&&now-t0>45e3)b.classList.add('x');
requestAnimationFrame(tick)};
window.__boot={err:m=>{$('bm2').textContent=m;b.classList.add('x')}};addEventListener('error',e=>{if(!done&&e.filename&&/\.js/.test(e.filename))window.__boot.err(d[1])});addEventListener('unhandledrejection',e=>{if(!done&&!(window.__stadium&&window.__stadium.renderer)){console.warn('[boot] unhandled',e.reason);window.__boot.err(d[1])}});requestAnimationFrame(tick)})();
</script>

<script>
// Graphics switch (owner 2026-11-16, HUD rail «Graphics»): per viewer, applied on reload. Off = the app exactly as before, nothing extra fetched.
// On = the footage look: main.js hq (as ?hq=1) + reel-hq.js and its modules (style D2, as film_v3 --hq). ?reel=1 keeps its own URL switches (hq=1&hqs=)
// gfx3: three levels. stadium.gfx '0' = Off, 'lite' = Lite, '1' = Full (the old ON value). Nothing stored: Lite everywhere (Damir 2026-11-17: Full ran 11.8 fps on desktop, Lite looks the same).
// ?gfx=off|lite|full beats the stored choice for this load only (measurement tools). window.__gfx stays true for Lite + Full (reel-hq.js layer).
window.__gfxLevel = 'off'; if (!/[?&]reel=1(&|$)/.test(location.search)) { let s = (location.search.match(/[?&]gfx=(off|lite|full)(&|$)/) || [])[1]; if (!s) { let v = null; try { v = localStorage.getItem('stadium.gfx'); } catch (e) {}
  s = v === '1' ? 'full' : v === 'lite' ? 'lite' : v === '0' ? 'off' : 'lite'; } window.__gfxLevel = s; }
window.__gfx = window.__gfxLevel !== 'off';</script>
<script>
// Boot: pick a working CDN for three.js (jsdelivr, else unpkg), then install the import map and start the app modules in order.
(async () => {
  const CDN = ['https://cdn.jsdelivr.net/npm/three@0.160.0/', 'https://unpkg.com/three@0.160.0/'];
  let base = null;
  for (let tries = 0; tries < 4 && !base; tries++) {
    for (const c of CDN) { try { await import(c + 'build/three.module.js'); base = c; break; } catch (e) { /* next CDN */ } }
    if (!base) await new Promise(r => setTimeout(r, 1200 * (tries + 1)));
  }
  if (!base) { __boot.err('No connection. Check your internet and retry. / Нет сети. Проверьте интернет и повторите.'); return; }
  const m = document.createElement('script'); m.type = 'importmap';
  m.textContent = JSON.stringify({ imports: { three: base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } });
  document.head.append(m);
  for (const s of ['main', 'join', 'sound', 'tiermap', 'editor']) {
    const e = document.createElement('script'); e.type = 'module'; e.async = false; e.src = 'js/' + s + '.js?v=898fdaa'; document.body.append(e);
  }
})();
</script>
